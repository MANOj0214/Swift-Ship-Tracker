<template>
    <lightning-card title="Swift Ship Tracker" icon-name="standard:shipment">
        <div class="slds-p-around_medium">
            <lightning-input
                label="Enter Parcel ID"
                value={parcelId}
                onchange={handleInput}
                placeholder="Example: SP1001">
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Track Parcel"
                    variant="brand"
                    onclick={handleTrack}>
                </lightning-button>
            </div>

            <template if:true={result}>
                <div class="slds-box slds-m-top_medium">
                    <p><strong>Parcel ID:</strong> {result.parcelId}</p>
                    <p><strong>Status:</strong> {result.status}</p>
                    <p><strong>Expected Delivery:</strong> {result.estimatedDelivery}</p>
                    <p>{result.message}</p>
                </div>
            </template>

            <template if:true={errorMessage}>
                <p class="slds-text-color_error slds-m-top_medium">
                    {errorMessage}
                </p>
            </template>
        </div>
    </lightning-card>
</template>
